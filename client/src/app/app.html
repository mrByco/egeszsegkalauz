<div class="min-h-screen bg-base-200">
  <header class="navbar bg-base-100 px-4 shadow-sm">
    <span class="flex-1 text-xl font-semibold">Egészségkalauz</span>
    @if (auth.user(); as user) {
      <span class="mr-3 text-sm opacity-70">{{ user.email }}</span>
      <button class="btn btn-ghost btn-sm" type="button" (click)="auth.logout()">
        Kijelentkezés
      </button>
    }
  </header>
  <main class="mx-auto max-w-4xl p-6">
    <router-outlet />
  </main>
</div>

<div class="min-h-screen bg-base-200">
  <header class="navbar gap-2 bg-base-100 px-4 shadow-sm">
    <a class="text-xl font-semibold" routerLink="/">Egészségkalauz</a>
    <nav class="flex flex-1 gap-1 pl-4">
      @if (auth.can('UsersView')) {
        <a class="btn btn-ghost btn-sm" routerLink="/admin/felhasznalok" routerLinkActive="btn-active">
          Felhasználók
        </a>
      }
      @if (auth.can('RolesView')) {
        <a class="btn btn-ghost btn-sm" routerLink="/admin/szerepkorok" routerLinkActive="btn-active">
          Szerepkörök
        </a>
      }
    </nav>
    @if (auth.user(); as user) {
      <span class="text-sm opacity-70">{{ user.email }}</span>
      <button class="btn btn-ghost btn-sm" type="button" (click)="auth.logout()">
        Kijelentkezés
      </button>
    }
  </header>
  <main class="mx-auto max-w-4xl p-6">
    <router-outlet />
  </main>
</div>
